<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山西水産 四代の物語</title>
<meta name="description" content="147年、ふぐ一筋。— 下関ふぐ老舗問屋 山西水産 四代の物語（和紙・墨・切り絵のアニメーション／縦型・48秒）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1B18;--fg:#F3EEE2;--accent:#C8412D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Shippori Mincho B1',serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
canvas{height:100%;width:auto;max-width:100%;aspect-ratio:9/16;display:block;border-radius:6px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#play{pointer-events:auto;cursor:pointer;border:0;border-radius:4px;background:var(--accent);color:#F3EEE2;font:800 18px 'Shippori Mincho B1',serif;padding:16px 30px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#play svg{width:16px;height:16px}
.hide{display:none!important}
body.render #ui{display:none}
body.render #stage{padding:0}
body.render canvas{width:1080px;height:1920px;max-width:none;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><button id="play" type="button" aria-label="音つきで再生"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>音つきで再生</button></div>
<audio id="au" src="track.mp3" preload="auto"></audio>
<script>
'use strict';
/* =========================================================
   147年、ふぐ一筋。— 山西水産 四代の物語
   和紙 × 墨 × 切り絵 / 1080×1920 / 90BPM・18小節 = 48秒
   内容は山西水産の会社サイト（lp.yamanisi.co.jp）掲載の事実と代表の言葉のみ
   ========================================================= */
const W = 1080, H = 1920;
const BPM = 90, B = 60 / BPM, BAR = B * 4, DUR = 18 * BAR;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

const P = {
  washi: '#F3EEE2', washi2: '#E9E1CF', sumi: '#1E1B18', sumi2: '#3A342E', shu: '#C8412D',
  ai: '#2B4B7A', ai2: '#5B8DB8', fugu: '#A9CBE8', gold: '#B8944A', kraft: '#C9A874',
  wood: '#8A6440', white: '#FFFDF7', matcha: '#7E9A5A'
};
const BRUSH = '"Yuji Syuku", serif', MIN = '"Shippori Mincho B1", serif';

/* ---------- utils ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const outBack = p => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const outCubic = p => 1 - Math.pow(1 - p, 3);
const inOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

/* ---------- time / cues（効果音のタイミングは描画側で登録し synth.py が読む） ---------- */
let T = 0, BOIL = 0;
const CUES = new Map();
function cue(type, beat) { const k = type + '@' + beat.toFixed(3); if (!CUES.has(k)) CUES.set(k, { type, t: +(beat * B).toFixed(4) }); }
function ent(b0, dur = .6, sfx = 'paper') { if (sfx) cue(sfx, b0); return clamp((T - b0 * B) / (dur * B)); }
const since = b0 => T - b0 * B;

/* ---------- textures: 和紙 ---------- */
const TEX = {};
function bakeWashi(w, h, base, seed, dark = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd(i * .011 + seed) - .5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  // 楮（こうぞ）の長い繊維
  g.lineCap = 'round';
  for (let k = 0; k < w * h / 2600; k++) {
    const x = rnd(k + seed) * w, y = rnd(k * 1.7 + seed) * h, a = rnd(k * 3.1 + seed) * Math.PI * 2, l = 20 + rnd(k * 5.3) * 70;
    g.globalAlpha = .06 + rnd(k * 9.1) * .08;
    g.strokeStyle = dark ? '#8B8174' : '#FFFFFF'; g.lineWidth = .6 + rnd(k * 2.2) * .9;
    g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + Math.cos(a) * l * .3 + 6, y + Math.sin(a) * l * .3, x + Math.cos(a) * l * .7 - 6, y + Math.sin(a) * l * .7, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.globalAlpha = .05;
  for (let k = 0; k < 60; k++) { g.fillStyle = dark ? '#000' : '#7A6A55'; g.beginPath(); g.arc(rnd(k * 11 + seed) * w, rnd(k * 13 + seed) * h, 1 + rnd(k * 17) * 2.5, 0, 7); g.fill(); }
  return c;
}
function bg(color, dark = false) {
  const k = 'bg' + color;
  if (!TEX[k]) TEX[k] = bakeWashi(W, H, color, color.charCodeAt(1) * 3.7 + color.charCodeAt(3), dark);
  ctx.drawImage(TEX[k], 0, 0);
}
let PAT = null;
function paperPattern() { if (!PAT) PAT = ctx.createPattern(bakeWashi(256, 256, '#8A8A8A', 5.5, true), 'repeat'); return PAT; }
/* 青海波（せいがいは）模様の紙 */
let SEIGAIHA = null;
function seigaiha(col, line) {
  if (SEIGAIHA) return SEIGAIHA;
  const c = document.createElement('canvas'); c.width = 120; c.height = 60; const g = c.getContext('2d');
  g.fillStyle = col; g.fillRect(0, 0, 120, 60);
  const draw = (cx, cy) => { for (let r = 30; r > 4; r -= 7) { g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.fillStyle = col; g.fill(); g.strokeStyle = line; g.lineWidth = 2.2; g.stroke(); } };
  [[0, 30], [60, 30], [120, 30], [30, 60], [90, 60], [0, 90], [60, 90]].forEach(p => draw(p[0], p[1] - 30 + 30));
  draw(30, 60); draw(90, 60);
  SEIGAIHA = ctx.createPattern(c, 'repeat'); return SEIGAIHA;
}

/* ---------- 紙のプリミティブ（ちぎり和紙・切り絵） ---------- */
function boil(seed, amp = 1.2) {
  return [(rnd(seed * 3.1 + BOIL * 7.3) - .5) * amp * 2, (rnd(seed * 5.7 + BOIL * 3.9) - .5) * amp * 2, (rnd(seed * 9.1 + BOIL * 1.3) - .5) * .006];
}
function tornPts(verts, seed, rough = 4, step = 14) {
  let area = 0;
  for (let i = 0; i < verts.length; i++) { const a = verts[i], b = verts[(i + 1) % verts.length]; area += a[0] * b[1] - b[0] * a[1]; }
  const sgn = area > 0 ? 1 : -1, pts = []; let k = 0;
  for (let i = 0; i < verts.length; i++) {
    const a = verts[i], b = verts[(i + 1) % verts.length];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, nx = dy / len * sgn, ny = -dx / len * sgn;
    const n = Math.max(1, Math.round(len / step));
    for (let j = 0; j < n; j++) { const u = j / n, off = (rnd(seed + k * .91) - .5) * 2 * rough; k++; pts.push([a[0] + dx * u + nx * off, a[1] + dy * u + ny * off, nx, ny]); }
  }
  return pts;
}
const rectV = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function circV(cx, cy, r, n = 40) { const v = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; v.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return v; }
function pathPts(pts, grow = 0) { ctx.beginPath(); pts.forEach((p, i) => { const x = p[0] + p[2] * grow, y = p[1] + p[3] * grow; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); }
function paper(verts, color, seed, o = {}) {
  const pts = tornPts(verts, seed, o.rough ?? 4, o.step ?? 14);
  ctx.save();
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(30,20,10,.3)'; ctx.shadowBlur = o.blur ?? 10; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = o.lift ?? 6; }
  if (o.edge !== false) { ctx.fillStyle = '#FFFDF7'; pathPts(pts, o.edgeW ?? 4); ctx.fill(); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = o.fill || color; pathPts(pts); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); pathPts(pts); ctx.clip(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = o.tex ?? .2;
  ctx.fillStyle = paperPattern(); ctx.fillRect(-2000, -2000, 5000, 6000); ctx.restore();
  ctx.restore();
  return pts;
}
function cutout(drawPath, color, o = {}) {
  ctx.save();
  ctx.shadowColor = 'rgba(30,20,10,.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 6;
  drawPath(); ctx.lineJoin = 'round'; ctx.strokeStyle = o.edgeCol || '#FFFDF7'; ctx.lineWidth = o.edge ?? 8; ctx.stroke();
  ctx.shadowColor = 'transparent';
  drawPath(); ctx.fillStyle = color; ctx.fill();
  ctx.save(); drawPath(); ctx.clip(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .18;
  ctx.fillStyle = paperPattern(); ctx.fillRect(-2000, -2000, 5000, 6000); ctx.restore();
  ctx.restore();
}
const GLYPHS = new Set();
function txt(s, x, y, size, font, color, o = {}) {
  for (const ch of s) GLYPHS.add(ch);
  ctx.save(); ctx.font = (o.weight || '') + ' ' + size + 'px ' + font;
  ctx.fillStyle = color; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, size, font, weight = '', ls = 0) { ctx.save(); ctx.font = weight + ' ' + size + 'px ' + font; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
/* 縦書き（句読点は右上へ、長音は縦棒に） */
function vtxt(s, x, y, size, font, color, o = {}) {
  const step = size * (o.step ?? 1.08), n = o.reveal ?? 1;
  const chars = [...s], shown = Math.ceil(chars.length * clamp(n));
  chars.slice(0, shown).forEach((ch, i) => {
    ctx.save(); ctx.translate(x, y + i * step);
    if ('、。'.includes(ch)) ctx.translate(size * .55, -size * .55);
    if ('ー―〜'.includes(ch)) ctx.rotate(Math.PI / 2);
    txt(ch, 0, 0, size, font, color, { weight: o.weight }); ctx.restore();
  });
}
function place(x, y, p, seed, rot, fn, o = {}) {
  if (p <= 0) return;
  const [bx, by, br] = boil(seed, o.boil ?? 1.2);
  const s = o.noScale ? 1 : outBack(clamp(p));
  const dy = (o.drop ?? 50) * (1 - outCubic(clamp(p)));
  ctx.save(); ctx.translate(x + bx, y + by - dy); ctx.rotate(rot + br + (o.spin ?? .18) * (1 - clamp(p))); ctx.scale(s, s);
  if (o.fade) ctx.globalAlpha *= clamp(p * 1.5);
  fn(); ctx.restore();
}
function strip(s, x, y, size, b0, seed, o = {}) {
  const w = tw(s, size, MIN, 800) + size * .9, h = size * 1.6;
  const p = ent(b0, .6, o.sfx ?? 'paper');
  const ax = o.align === 'left' ? w / 2 : o.align === 'right' ? -w / 2 : 0;
  place(x + ax, y, p, seed, o.rot ?? (rnd(seed) - .5) * .04, () => {
    paper(rectV(-w / 2, -h / 2, w, h), o.bg || P.white, seed, { rough: 3 });
    txt(s, 0, size * .06, size, MIN, o.fg || P.sumi, { weight: 800 });
  }, { drop: 24, spin: .05 });
}
/* 落款（はんこ） */
function hanko(label, size, b0, x, y, seed, o = {}) {
  const p = ent(b0, .35, 'stamp');
  place(x, y, p, seed, o.rot ?? -.08, () => {
    ctx.save(); ctx.globalAlpha = .92;
    const s = size;
    ctx.fillStyle = P.shu; ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, s * .08); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = .35;
    for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc((rnd(seed + i) - .5) * s, (rnd(seed + i * 2) - .5) * s, 1 + rnd(i * 3) * 4, 0, 7); ctx.fill(); }
    ctx.restore();
    const lines = label.split('\n');
    lines.forEach((ln, i) => vtxt(ln, (lines.length - 1) * s * .19 - i * s * .38, -s * .5 + s * .2 + (ln.length < 3 ? s * .12 : 0), s * (lines.length > 1 ? .3 : .36), BRUSH, P.white, { step: 1.02 }));
  }, { drop: -20, spin: 0 });
}
/* 墨の筆あと（筆圧とかすれ） */
function brush(pts, width, prog, seed, color = P.sumi) {
  if (prog <= 0) return;
  const total = pts.length - 1, upto = Math.floor(total * clamp(prog));
  ctx.save(); ctx.fillStyle = color;
  for (let i = 0; i <= upto; i++) {
    const u = i / total, pr = Math.sin(Math.PI * clamp(u * 1.1 + .05)) * .75 + .25;
    const w = width * pr * (.85 + rnd(seed + i) * .3);
    const [x, y] = pts[i];
    ctx.globalAlpha = u > .8 && rnd(seed + i * 7) > .55 ? .35 : .9;
    ctx.beginPath(); ctx.ellipse(x, y, w / 2, w / 2.4, u * 3, 0, 7); ctx.fill();
    if (u > .75) { ctx.globalAlpha = .5; ctx.beginPath(); ctx.arc(x + (rnd(seed + i * 3) - .5) * w * .8, y + (rnd(seed + i * 5) - .5) * w * .8, w * .08, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}
function ensoPts(cx, cy, r, seed) {
  const pts = [];
  for (let i = 0; i <= 220; i++) { const a = -Math.PI * .6 + i / 220 * Math.PI * 1.85; const rr = r * (1 + (rnd(seed + i * .1) - .5) * .02); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return pts;
}
function tape(x, y, w, rot, color = 'rgba(200,65,45,.55)') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const h = 40, v = [];
  for (let i = 0; i <= 6; i++) v.push([-w / 2 + (i % 2 ? 5 : -2), -h / 2 + i * h / 6]);
  for (let i = 6; i >= 0; i--) v.push([w / 2 + (i % 2 ? -5 : 2), -h / 2 + i * h / 6]);
  ctx.beginPath(); v.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
const IMG = {};
function photo(img, w, h, label, seed, o = {}) {
  const pad = o.pad ?? 18, bottom = label ? 78 : pad;
  ctx.save(); ctx.shadowColor = 'rgba(30,20,10,.35)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 8;
  ctx.fillStyle = P.white; ctx.fillRect(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad + bottom); ctx.restore();
  if (img) { ctx.save(); ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip(); const s = Math.max(w / img.width, h / img.height); ctx.drawImage(img, -img.width * s / 2, -img.height * s * (o.oy ?? .5), img.width * s, img.height * s); ctx.restore(); }
  if (label) txt(label, 0, h / 2 + 42, 36, MIN, P.sumi, { weight: 800 });
  tape(0, -h / 2 - pad, 160, (rnd(seed) - .5) * .3, o.tape || 'rgba(91,141,184,.6)');
}

/* ---------- 切り絵パーツ ---------- */
/* ふぐ（シマフグは縞入り） */
function fugu(s, color, o = {}) {
  const puff = o.puff ?? 1;
  cutout(() => { ctx.beginPath(); ctx.moveTo(-88 * s, 0); ctx.lineTo(-150 * s, -46 * s); ctx.lineTo(-140 * s, 0); ctx.lineTo(-150 * s, 46 * s); ctx.closePath(); }, color);
  cutout(() => { ctx.beginPath(); ctx.ellipse(0, 0, 100 * s * puff, 76 * s * puff, 0, 0, 7); }, color);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 100 * s * puff, 76 * s * puff, 0, 0, 7); ctx.clip();
  ctx.fillStyle = P.white; ctx.beginPath(); ctx.ellipse(10 * s, 46 * s * puff, 92 * s, 44 * s, 0, 0, 7); ctx.fill();
  if (o.stripes) { ctx.strokeStyle = P.sumi2; ctx.lineWidth = 9 * s; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 34 * s - 20 * s, -80 * s); ctx.quadraticCurveTo(i * 34 * s + 10 * s, -20 * s, i * 34 * s - 6 * s, 20 * s); ctx.stroke(); } }
  else { ctx.fillStyle = 'rgba(30,27,24,.35)'; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc((rnd(i) - .5) * 150 * s, (rnd(i + 3) - .9) * 70 * s, 5 * s, 0, 7); ctx.fill(); } }
  ctx.restore();
  cutout(() => { ctx.beginPath(); ctx.moveTo(-10 * s, 10 * s); ctx.quadraticCurveTo(-40 * s, 40 * s, -8 * s, 44 * s); ctx.closePath(); }, color, { edge: 5 });
  ctx.fillStyle = P.white; ctx.beginPath(); ctx.arc(52 * s, -22 * s, 17 * s, 0, 7); ctx.fill();
  ctx.fillStyle = P.sumi; ctx.beginPath(); ctx.arc(56 * s, -22 * s, 9 * s, 0, 7); ctx.fill();
  ctx.strokeStyle = P.sumi; ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.arc(94 * s, 8 * s, 8 * s, Math.PI * .7, Math.PI * 1.3); ctx.stroke();
}
function boat(s, color = P.wood) {
  cutout(() => { ctx.beginPath(); ctx.moveTo(-120 * s, -20 * s); ctx.lineTo(130 * s, -20 * s); ctx.lineTo(95 * s, 30 * s); ctx.lineTo(-90 * s, 30 * s); ctx.closePath(); }, color);
  cutout(() => { ctx.beginPath(); ctx.rect(-6 * s, -150 * s, 10 * s, 132 * s); }, P.sumi2, { edge: 4 });
  cutout(() => { ctx.beginPath(); ctx.moveTo(10 * s, -140 * s); ctx.lineTo(95 * s, -40 * s); ctx.lineTo(10 * s, -40 * s); ctx.closePath(); }, P.washi2);
}
function ship(s) {
  cutout(() => { ctx.beginPath(); ctx.moveTo(-200 * s, -30 * s); ctx.lineTo(210 * s, -30 * s); ctx.lineTo(170 * s, 40 * s); ctx.lineTo(-170 * s, 40 * s); ctx.closePath(); }, P.ai);
  cutout(() => { ctx.beginPath(); ctx.rect(40 * s, -110 * s, 110 * s, 80 * s); }, P.white);
  cutout(() => { ctx.beginPath(); ctx.rect(100 * s, -160 * s, 26 * s, 50 * s); }, P.shu, { edge: 5 });
  [-150, -90, -30].forEach((x, i) => paper(rectV(x * s, -84 * s, 54 * s, 54 * s), P.kraft, 880 + i, { rough: 2, lift: 3 }));
}
function crate(s, seed, label = '水産') {
  paper(rectV(-80 * s, -60 * s, 160 * s, 120 * s), P.kraft, seed, { rough: 2.5 });
  ctx.strokeStyle = 'rgba(90,60,30,.5)'; ctx.lineWidth = 3;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-80 * s, i * 38 * s); ctx.lineTo(80 * s, i * 38 * s); ctx.stroke(); }
  txt(label, 0, 4, 44 * s, BRUSH, P.shu);
}
function factory(s, seed) {
  paper(rectV(-230 * s, -150 * s, 460 * s, 150 * s), P.washi2, seed, { rough: 3 });
  paper([[-230 * s, -150 * s], [-150 * s, -220 * s], [-150 * s, -150 * s], [-70 * s, -220 * s], [-70 * s, -150 * s], [10 * s, -220 * s], [10 * s, -150 * s], [90 * s, -220 * s], [90 * s, -150 * s]], P.ai, seed + 1, { rough: 2 });
  paper(rectV(140 * s, -300 * s, 50 * s, 150 * s), P.sumi2, seed + 2, { rough: 2 });
  for (let i = 0; i < 4; i++) { ctx.fillStyle = '#F7E3A0'; ctx.fillRect((-200 + i * 100) * s, -110 * s, 50 * s, 40 * s); }
  paper(rectV(-40 * s, -80 * s, 80 * s, 80 * s), P.wood, seed + 3, { rough: 1.5, lift: 2 });
}
function phone(s, seed) {
  cutout(() => { ctx.beginPath(); ctx.roundRect(-80 * s, -150 * s, 160 * s, 300 * s, 22 * s); }, P.sumi);
  ctx.fillStyle = '#EAF2F8'; ctx.beginPath(); ctx.roundRect(-66 * s, -126 * s, 132 * s, 250 * s, 8 * s); ctx.fill();
  ctx.save(); ctx.translate(0, -40 * s); fugu(.4 * s, P.fugu); ctx.restore();
  ctx.fillStyle = P.shu; ctx.beginPath(); ctx.roundRect(-50 * s, 50 * s, 100 * s, 36 * s, 8 * s); ctx.fill();
  txt('購入', 0, 69 * s, 22 * s, MIN, P.white, { weight: 800 });
}
function waves(y, b0, seed, o = {}) {
  const p = ent(b0, .8, o.sfx === undefined ? 'wave' : o.sfx);
  place(0, 0, p, seed, 0, () => {
    for (let r = 0; r < 3; r++) {
      const yy = y + r * 70, off = Math.sin(T * 1.6 + r) * 24;
      const v = [[-80, yy]];

/* ---------- transitions: 青海波の和紙がすべる ---------- */
function transition(t) {
  const cols = [P.ai, P.shu, P.gold, P.ai2, P.sumi2, P.matcha, P.ai];
  SC.slice(1).forEach((sc, k) => {
    const tb = sc.b * B, d = t - tb;
    if (d < -.45 || d > .45) return;
    cue('whoosh', sc.b - .6);
    const x = d < 0 ? lerp(W + 100, -60, inOut(clamp((d + .45) / .45))) : lerp(-60, -W - 300, inOut(clamp(d / .45)));
    ctx.save(); ctx.translate(x, 0); ctx.rotate(-.025);
    const pts = paper(rectV(0, -200, W + 220, H + 400), cols[k % cols.length], 900 + k, { rough: 12, step: 22 });
    ctx.save(); pathPts(pts); ctx.clip(); ctx.globalAlpha = .18; ctx.fillStyle = seigaiha(P.ai, '#FFFFFF'); ctx.fillRect(0, -200, W + 220, H + 400); ctx.restore();
    ctx.restore();
  });
}

function render(t) {
  t = clamp(t, 0, DUR - 1e-4);
  T = Math.round(t * 12) / 12; BOIL = Math.floor(t * 6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const beat = T / B; let sc = SC[0];
  for (const s of SC) if (beat >= s.b) sc = s;
  const prog = clamp((beat - sc.b) / (sc.e - sc.b)), z = 1 + .022 * prog;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); sc.fn(); ctx.restore();
  transition(t);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(30,20,10,0)'); v.addColorStop(1, 'rgba(30,20,10,.22)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fi = 1 - clamp(t / .5), fo = clamp((t - (DUR - .5)) / .5);
  if (fi + fo > 0) { ctx.fillStyle = 'rgba(30,27,24,' + Math.max(fi, fo) + ')'; ctx.fillRect(0, 0, W, H); }
}

function loadImages() {

}
async function loadFonts() {
  for (let t = 0; t < DUR; t += .25) render(t);
  const s = [...GLYPHS].join('') + '0123456789';
  await Promise.all([document.fonts.load('40px "Yuji Syuku"', s), document.fonts.load('800 40px "Shippori Mincho B1"', s), document.fonts.load('700 40px "Shippori Mincho B1"', s)]).catch(() => {});
  await document.fonts.ready;
}
const au = document.getElementById('au'), btn = document.getElementById('play');
let playing = false, t0 = 0, ready = false;
const now = () => (!au.paused && au.readyState >= 2 && !au.error) ? au.currentTime : (performance.now() - t0) / 1000;
function loop() { if (!playing) return; const t = now(); if (t >= DUR) { playing = false; render(DUR - .6); btn.classList.remove('hide'); return; } render(t); requestAnimationFrame(loop); }
function start() { if (!ready) return; btn.classList.add('hide'); playing = true; t0 = performance.now(); try { au.currentTime = 0; const pr = au.play(); if (pr) pr.catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
function pause() { playing = false; try { au.pause(); } catch (e) {} btn.classList.remove('hide'); }
btn.addEventListener('click', start);
cv.addEventListener('click', () => playing ? pause() : start());
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : start(); } });
window.renderAt = render;
window.getCues = () => [...CUES.values()].sort((a, b) => a.t - b.t);
window.DURATION = DUR;
window.__ready = (async () => {
  if (/[?&]render/.test(location.search)) document.body.classList.add('render');
  await loadImages(); await loadFonts(); ready = true; render(46); return true;
})();
